# Local stack: PostgreSQL + the ModelOps AI app (API and built frontend on one origin).
#   docker compose up -d db        # database only (for local development / tests)
#   docker compose up --build      # full stack on http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modelops
      POSTGRES_PASSWORD: modelops   # local development only
      POSTGRES_DB: modelops
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - modelops-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelops -d modelops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://modelops:modelops@db:5432/modelops
      FRONTEND_URL: http://localhost:8000
      BACKEND_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  modelops-pgdata:
