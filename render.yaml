# Render Blueprint — https://render.com/docs/blueprint-spec
# One Docker web service (API + built frontend on the same origin) and one PostgreSQL database.
# Secrets are never stored here: JWT/encryption keys are generated by Render, provider keys are
# entered by users in the app, and the optional AI Analyst key is set in the Render dashboard.
databases:
  - name: modelops-db
    plan: free
    databaseName: modelops
    user: modelops
    postgresMajorVersion: "16"
    ipAllowList: [] # no public access; only services in the same Render account/region

services:
  - type: web
    name: modelops-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: modelops-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true # back this value up: losing it makes stored provider keys unreadable
      - key: LOG_LEVEL
        value: INFO
      - key: TRUSTED_PROXY_HOPS # Render's proxy appends the client IP to X-Forwarded-For
        value: "1"
      - key: RATE_LIMIT_GATEWAY_PER_MINUTE
        value: "120"
      # Optional AI Analyst (platform key). Set these in the Render dashboard.
      - key: AI_ANALYST_PROVIDER
        sync: false
      - key: AI_ANALYST_MODEL
        sync: false
      - key: AI_ANALYST_API_KEY
        sync: false
